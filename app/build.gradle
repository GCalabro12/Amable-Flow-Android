plugins {
    id 'com.android.application'
}

android {
    namespace 'club.practicaintegral.flow'
    compileSdk 36

    defaultConfig {
        applicationId 'club.practicaintegral.flow'
        minSdk 26
        targetSdk 36
        // La compilación automática de GitHub pone el número de versión
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'sin-clave.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'flow'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Entrar con Google dentro de la app (Credential Manager de Android + identidad de Google), como Amable Life
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
